<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lumina | Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-content">
<!-- Home -->
<section class="h-screen flex flex-col items-center justify-center px-6 text-center">
<div class="absolute top-10 right-10 flex gap-8">
<button onclick="window.renderDashboard()" class="text-xs font-black uppercase tracking-widest opacity-40 hover:opacity-100 transition-all">Account</button>
<button onclick="window.renderAdmin()" class="text-xs font-black uppercase tracking-widest opacity-20 hover:opacity-100 transition-all">Admin</button>
</div>
<h1 class="text-7xl font-bold tracking-tighter mb-6">Lumina.</h1>
<p class="text-2xl text-gray-400 mb-12 font-light">Global stores, delivered in Nigeria.</p>
<div class="w-full max-w-3xl relative shadow-2xl rounded-full">
<input type="text" id="url-in" placeholder="Paste Amazon link..." class="w-full px-8 py-6 rounded-full border border-gray-100 focus:outline-none text-xl">
<button onclick="extract()" class="absolute right-3 top-3 bottom-3 bg-black text-white px-10 rounded-full font-bold">Go</button>
</div>
</section>
</div>
<script src="orderStorage.js"></script>
<script src="AdminDashboard.js"></script>
<script src="Checkout.js"></script>
<script src="Success.js"></script>
<script src="UserDashboard.js"></script>
<script src="server.js"></script>
<script>
function extract() {
const url = document.getElementById('url-in').value;
if(!url) return;
document.getElementById('app-content').innerHTML = `
<div class="h-screen flex flex-col items-center justify-center">
<div class="w-16 h-16 border-4 border-black border-t-transparent rounded-full animate-spin mb-6"></div>
<p class="text-sm font-black uppercase tracking-widest animate-pulse">Scanning Global Inventory...</p>
</div>`;
window.postMessage({ type: 'lumina_parse', url: url }, '*');
}
window.addEventListener('message', (e) => {
if(e.data.type === 'lumina_result') {
window.renderCheckout(e.data.product);
}
});
</script>
</body>
</html>
